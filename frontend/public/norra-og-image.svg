<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F131C"/>
      <stop offset="45%" stop-color="#07090E"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="25%" stop-color="#F2D06B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#7A5600"/>
    </linearGradient>

    <radialGradient id="ogCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="ogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Deep Velvet Obsidian Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Radial Golden Aura -->
  <circle cx="600" cy="315" r="450" fill="url(#ogCenterGlow)"/>

  <!-- Luxury Outer Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="42" y="42" width="1116" height="546" rx="16" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Centered Content -->
  <g transform="translate(600, 200)" text-anchor="middle">
    <!-- Emblem Box -->
    <g transform="translate(-55, -120)">
      <rect x="0" y="0" width="110" height="110" rx="28" fill="#141824" stroke="#D4AF37" stroke-width="2" filter="url(#ogShadow)"/>
      <!-- Emblem Monogram N -->
      <g filter="url(#ogShadow)">
        <path d="M 28 30 L 44 30 L 44 34 L 39 35 L 39 80 L 44 81 L 44 85 L 28 85 L 28 81 L 33 80 L 33 35 L 28 34 Z" fill="url(#ogGold)"/>
        <path d="M 70 30 L 86 30 L 86 34 L 81 35 L 81 80 L 86 81 L 86 85 L 70 85 L 70 81 L 75 80 L 75 35 L 70 34 Z" fill="url(#ogGold)"/>
        <polygon points="39,33 50,33 79,81 68,81" fill="url(#ogGold)"/>
      </g>
      <!-- Sparkle -->
      <path d="M 90 20 Q 90 28 82 28 Q 90 28 90 36 Q 90 28 98 28 Q 90 28 90 20 Z" fill="#FFF5D6"/>
    </g>

    <!-- Eyebrow Pill -->
    <rect x="-140" y="24" width="280" height="32" rx="16" fill="rgba(212,175,55,0.12)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
    <text x="0" y="45" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F2D06B" letter-spacing="4">HAUTE MAISON &amp; ATELIER</text>

    <!-- Brand Headline -->
    <text x="0" y="130" font-family="'Cinzel', 'Playfair Display', 'Sora', 'Georgia', serif" font-size="76" font-weight="800" fill="url(#ogGold)" letter-spacing="18" filter="url(#ogShadow)">NORRA ECOM</text>

    <!-- Subtitle -->
    <text x="0" y="180" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#CBD5E1" letter-spacing="4">Curated Luxury Footwear · Bespoke Leathercraft · Haute Essentials</text>

    <!-- Trust Badges Row -->
    <g transform="translate(0, 240)">
      <text x="-260" y="0" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#D4AF37" letter-spacing="2">✦ 100% AUTHENTIC</text>
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#D4AF37" letter-spacing="2">✦ WHITE-GLOVE DISPATCH</text>
      <text x="260" y="0" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#D4AF37" letter-spacing="2">✦ CONCIERGE SUPPORT</text>
    </g>
  </g>
</svg>