<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0A0C12"/>
      <stop offset="100%" stop-color="#05060A"/>
    </linearGradient>

    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="25%" stop-color="#F2D06B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#7A5600"/>
    </linearGradient>

    <linearGradient id="logoStarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5E4B2"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Brand Mark Icon Box (Left) -->
  <g transform="translate(20, 20)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="140" height="140" rx="36" fill="url(#logoBgGrad)" stroke="#D4AF37" stroke-width="1.8"/>
    <rect x="4" y="4" width="132" height="132" rx="32" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- 4-Point Star Accent -->
    <path d="M 115 25 Q 115 34 106 34 Q 115 34 115 43 Q 115 34 124 34 Q 115 34 115 25 Z" fill="url(#logoStarGrad)" filter="url(#logoGlow)"/>

    <!-- Monogram 'N' -->
    <g filter="url(#logoGlow)">
      <!-- Left Pillar -->
      <path d="M 36 38 L 56 38 L 56 44 L 50 45 L 50 102 L 56 103 L 56 108 L 36 108 L 36 103 L 42 102 L 42 45 L 36 44 Z" fill="url(#logoGoldGrad)"/>
      <!-- Right Pillar -->
      <path d="M 90 38 L 110 38 L 110 44 L 104 45 L 104 102 L 110 103 L 110 108 L 90 108 L 90 103 L 96 102 L 96 45 L 90 44 Z" fill="url(#logoGoldGrad)"/>
      <!-- Diagonal -->
      <polygon points="50,42 64,42 100,104 86,104" fill="url(#logoGoldGrad)"/>
    </g>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(190, 0)">
    <!-- Main Brand Name -->
    <text x="0" y="98" font-family="'Cinzel', 'Playfair Display', 'Sora', 'Georgia', serif" font-size="64" font-weight="800" fill="url(#logoGoldGrad)" letter-spacing="12" filter="url(#logoGlow)">NORRA</text>
    
    <!-- Subtitle / Category -->
    <text x="4" y="132" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#E2E8F0" letter-spacing="9">ECOM</text>
    <text x="110" y="132" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#8E9BB0" letter-spacing="4">·  LUXURY CURATED ATELIER</text>
  </g>
</svg>